spring:
  application:
    name: ciakme

  datasource:
    url: jdbc:postgresql://localhost:5432/ciakme
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.ciakme: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

jwt:
  secret: "ciakme-super-secret-key-must-be-at-least-32-characters-long"
  expiration-ms: 86400000  # 24 ore in millisecondi